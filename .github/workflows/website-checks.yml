name: Website checks (no deployment)
on:
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-checks.yml"]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
