name: Build Windows executable & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.2beta)"
        required: true
      source_ref:
        description: "Branch that holds the app source (main only has the README and website)"
        required: false
        default: "claude/ecstatic-ramanujan-qz4m34"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same script developers run locally: creates .venv, installs deps, runs the test suite, builds the exe.
      - name: Build with build_exe.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: .\build_exe.ps1

      - name: Smoke test — launch the exe from another folder and wait for the UI server
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\PulseReview.exe'
          $work = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'smoke')
          $env:ZEROPULSE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'smoke-data'
          $p = Start-Process -FilePath $exe -ArgumentList '--browser','--port','8765' -WorkingDirectory $work -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            if ($p.HasExited) { break }
          }
          if ($ok) {
            $css = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/assets/style.css'
            if ($css.StatusCode -ne 200) { throw 'bundled assets missing' }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process PulseReview -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'The executable did not start its UI server within 3 minutes.' }
          if (-not (Test-Path (Join-Path $env:ZEROPULSE_DATA_DIR 'reviews.db'))) { throw 'User data was not created in the data directory.' }
          Write-Host 'Smoke test passed: UI served, assets bundled, data written outside the bundle.'

      - name: Checksum
        shell: powershell
        run: |
          $h = (Get-FileHash dist\PulseReview.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PulseReview.exe" | Out-File -Encoding ascii dist\PulseReview.exe.sha256
          Get-Content dist\PulseReview.exe.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PulseReview ${{ env.RELEASE_TAG }}
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/PulseReview.exe
            dist/PulseReview.exe.sha256
